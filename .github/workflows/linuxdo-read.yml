name: Linux.do 自动阅读帖子
on:
  schedule:
    # UTC 时间，每 6 小时一次
    # UTC 00:00 = 北京 08:00
    # UTC 06:00 = 北京 14:00
    # UTC 12:00 = 北京 20:00
    # UTC 18:00 = 北京 02:00
    - cron: '0 0,6,12,18 * * *'  # 北京 08,14,20,02
  workflow_dispatch:
    inputs:
      debug:
        description: '调试模式 (启用后会保存截图和 HTML 日志)'
        required: false
        type: boolean

jobs:
  read-posts:
    permissions:
      id-token: write
      contents: read
    runs-on: windows-2025
    environment: production
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - name: set beijing timezone
      uses: szenius/set-timezone@v2.0
      with:
        timezoneWindows: "China Standard Time"

    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      if: steps.uv-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装项目依赖..."
        uv sync
        echo "✅ 环境初始化完成"

    - name: 获取 Camoufox 版本
      id: camoufox-version
      run: |
        $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('camoufox'))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Camoufox version: $version"

    - name: 缓存 Camoufox 浏览器
      uses: actions/cache@v4
      id: camoufox-cache
      with:
        path: ~\AppData\Local\camoufox
        key: ${{ runner.os }}-camoufox-${{ steps.camoufox-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-camoufox-

    - name: 安装 Camoufox 浏览器
      if: steps.camoufox-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始下载 Camoufox 浏览器..."
        uv run camoufox fetch
        echo "✅ Camoufox 浏览器安装完成"

    - name: 恢复登录状态缓存
      uses: actions/cache/restore@v4
      with:
        path: |
          storage-states
        key: storage-state-${{ hashFiles('storage-states/*.json') }}
        restore-keys: |
          storage-state-

    - name: 从 secret 注入 storage state (bootstrap 用)
      env:
        STORAGE_STATES_JSON: ${{ secrets.STORAGE_STATES_JSON }}
        FORCE_STORAGE_OVERWRITE: ${{ vars.FORCE_STORAGE_OVERWRITE }}
      run: |
        if (-not $env:STORAGE_STATES_JSON) {
          echo "ℹ️ STORAGE_STATES_JSON 未配置，跳过"
          exit 0
        }
        New-Item -ItemType Directory -Force -Path storage-states | Out-Null
        $force = $env:FORCE_STORAGE_OVERWRITE -in @('1','true','yes')
        $data = $env:STORAGE_STATES_JSON | ConvertFrom-Json
        foreach ($prop in $data.PSObject.Properties) {
          $path = "storage-states/linuxdo_$($prop.Name)_storage_state.json"
          if ((Test-Path $path) -and -not $force) {
            echo "⏭️  cache 已有，跳过（保留续期后的 cookie）: $path"
            continue
          }
          $prop.Value | ConvertTo-Json -Depth 20 -Compress | Set-Content -Path $path -Encoding utf8
          if (Test-Path $path) {
            if ($force) {
              echo "🔄 强制覆盖（FORCE_STORAGE_OVERWRITE=1）: $path"
            } else {
              echo "✅ 写入（cache 未命中）: $path"
            }
          }
        }

    - name: 恢复帖子ID缓存
      uses: actions/cache/restore@v4
      with:
        path: |
          linuxdo_reads
        key: linuxdo-reads-${{ hashFiles('linuxdo_reads/*.txt') }}
        restore-keys: |
          linuxdo-reads-

    - name: 启动 Xray 代理
      env:
        VLESS_URL: ${{ secrets.VLESS_URL }}
      run: |
        if (-not $env:VLESS_URL) {
          echo "ℹ️ VLESS_URL 未配置，跳过 Xray 代理"
          exit 0
        }
        $ErrorActionPreference = "Stop"

        # 下载 Xray
        $xrayUrl = "https://github.com/XTLS/Xray-core/releases/download/v25.3.6/Xray-windows-64.zip"
        echo "⬇️ 正在下载 Xray..."
        curl.exe -fSL -o xray.zip $xrayUrl
        Expand-Archive -Path xray.zip -DestinationPath xray -Force
        Remove-Item xray.zip

        # 验证二进制
        & xray\xray.exe version

        # 生成配置
        echo "⚙️ 正在生成 Xray 配置..."
        uv run python scripts/setup_xray.py

        # 后台启动 Xray
        echo "🚀 正在启动 Xray..."
        $proc = Start-Process -FilePath "xray\xray.exe" `
          -ArgumentList "run", "-config", "xray_config.json" `
          -WindowStyle Hidden -PassThru
        echo "Xray PID: $($proc.Id)"

        # 等待 SOCKS5 端口就绪
        $ready = $false
        for ($i = 0; $i -lt 30; $i++) {
          try {
            $tcp = New-Object System.Net.Sockets.TcpClient
            $tcp.Connect("127.0.0.1", 1080)
            $tcp.Close()
            $ready = $true
            break
          } catch {
            Start-Sleep -Seconds 1
          }
        }
        if (-not $ready) {
          echo "❌ SOCKS5 端口 1080 在 30 秒内未就绪"
          if (Test-Path xray_error.log) { Get-Content xray_error.log }
          exit 1
        }
        echo "✅ Xray 代理已就绪 (socks5://127.0.0.1:1080)"

    - name: 执行阅读帖子
      env:
        ACCOUNTS: ${{ secrets.ACCOUNTS_LINUX_DO }}
        LINUXDO_BASE_TOPIC_ID: ${{ secrets.LINUXDO_BASE_TOPIC_ID }}
        LINUXDO_MAX_POSTS: ${{ secrets.LINUXDO_MAX_POSTS }}
        PROXY: ${{ secrets.VLESS_URL && 'socks5://127.0.0.1:1080' || secrets.PROXY }}
        DEBUG: ${{ github.event_name == 'workflow_dispatch' && inputs.debug || vars.DEBUG || 'false' }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
      run: |
        # 列出 linuxdo_reads 目录文件
        if (Test-Path "linuxdo_reads") {
          echo "📁 linuxdo_reads 目录内容:"
          Get-ChildItem -Path linuxdo_reads -File | ForEach-Object { echo "  - $($_.Name)" }
        } else {
          echo "⚠️ linuxdo_reads 目录不存在"
        }
        # 执行阅读帖子
        uv run python -u linuxdo_read_posts.py

    - name: 保存登录状态缓存
      if: hashFiles('storage-states/*.json') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          storage-states
        key: storage-state-${{ hashFiles('storage-states/*.json') }}

    - name: 保存帖子ID缓存
      if: hashFiles('linuxdo_reads/*.txt') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          linuxdo_reads
        key: linuxdo-reads-${{ hashFiles('linuxdo_reads/*.txt') }}

    - name: 保存日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linuxdo-read-artifacts-${{ github.run_number }}
        path: |
          logs/
          screenshots/
          xray_access.log
          xray_error.log
        if-no-files-found: ignore
        retention-days: 7

    - name: 执行结果
      if: always()
      run: |
        echo "阅读帖子任务执行完成"
        echo "时间: $(Get-Date)"
